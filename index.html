<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Support — 5Ner</title>
<meta name="description" content="Support the author 5Ner with USDT.">
<meta property="og:title" content="Support — 5Ner">
<meta property="og:description" content="Support the author with USDT. Safe, fast and no fees.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
    font-family: 'Press Start 2P', 'Courier New', monospace;
    background-image: url('./bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4vh 3vw 2vh 3vw;
    color: white;
    position: relative;
    overflow-x: hidden;
    width: 100%;
    max-width: 100vw;
}
body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: -1; }

.header-row { display: flex; align-items: center; justify-content: center; gap: 3vw; margin-bottom: 5vh; width: 100%; max-width: 96vw; }
.avatar { width: clamp(3.2rem, 13vw, 5rem); height: clamp(3.2rem, 13vw, 5rem); border-radius: 50%; object-fit: cover; object-position: center; box-shadow: 0 0 22px rgba(255,255,255,0.55); overflow: hidden; background: #000; flex-shrink: 0; image-rendering: pixelated; }
h1 { font-family: 'Press Start 2P', monospace; font-size: clamp(1.4rem, 7vw, 2.6rem); text-shadow: 0 0 14px rgba(255,255,255,0.6); letter-spacing: 0.1em; }

/* Support Widget Box */
.support-widget {
    background: #0a0a0a;
    border: 2px solid #39ff14;
    border-radius: 14px;
    padding: 4vw;
    width: 100%;
    max-width: min(92vw, 480px);
    text-align: center;
    box-shadow: 0 0 35px rgba(57, 255, 20, 0.4);
    position: relative;
    margin-bottom: 4vh;
}

/* Кнопка закрытия QR */
.close-qr-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #ff4444;
    border: 2px solid #ff4444;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(0.6rem, 2.5vw, 0.8rem);
    width: clamp(1.8rem, 6vw, 2.2rem);
    height: clamp(1.8rem, 6vw, 2.2rem);
    border-radius: 50%;
    cursor: pointer;
    display: none; /* Скрыт по умолчанию */
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 0;
    transition: all 0.3s ease;
}
.close-qr-btn:hover { background: #fff; color: #ff4444; }
.close-qr-btn.active { display: flex; }

.pay-title { font-family: 'Press Start 2P', monospace; font-size: clamp(0.6rem, 2.8vw, 0.9rem); color: #39ff14; margin-bottom: 2vh; line-height: 1.6; }
.pay-sub { font-family: 'VT323', monospace; font-size: clamp(1.1rem, 4.5vw, 1.4rem); color: #cccccc; margin-bottom: 3vh; letter-spacing: 0.05em; }

.pay-tokens { display: flex; gap: 3vw; justify-content: center; margin-bottom: 3vh; flex-wrap: nowrap; }
.pay-token { position: relative; width: clamp(3.5rem, 15vw, 5rem); height: clamp(3.5rem, 15vw, 5rem); cursor: pointer; flex-shrink: 0; transition: transform 0.3s ease; -webkit-tap-highlight-color: transparent; }
.pay-token img { display: block; width: 100%; height: 100%; object-fit: contain; opacity: 0.35; transition: opacity 0.5s ease, filter 0.5s ease; border-radius: 50%; }
.pay-token.lit img { opacity: 1; filter: drop-shadow(0 0 8px var(--color)) drop-shadow(0 0 18px var(--color)) drop-shadow(0 0 30px var(--color)); }
.pay-token.active img { opacity: 1; filter: drop-shadow(0 0 10px var(--color)) drop-shadow(0 0 22px var(--color)) drop-shadow(0 0 38px var(--color)); }
.pay-token.tron { --color: #FA0B12; }
.pay-token.bnb { --color: #FCC703; }
.pay-token.eth { --color: #2D6EFA; }
.pay-token.sol { --color: #20E88B; }

.pay-token .lightning { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; overflow: hidden; opacity: 0; border-radius: 50%; }
.pay-token .lightning::before { content: ''; position: absolute; top: -20%; left: -50%; width: 25%; height: 140%; background: linear-gradient(90deg, transparent 0%, var(--color) 30%, #ffffff 50%, var(--color) 70%, transparent 100%); filter: blur(4px); transform: skewX(-12deg); }
.pay-token.zap .lightning { opacity: 1; }
.pay-token.zap .lightning::before { animation: sweepLightning 0.9s ease-in-out forwards; }
@keyframes sweepLightning { 0% { left: -50%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { left: 130%; opacity: 0; } }

.pay-qr-wrap { display: none; flex-direction: column; align-items: center; width: 100%; animation: workFadeIn 0.4s ease; }
.pay-qr-wrap.active { display: flex; }
@keyframes workFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.pay-qr { background: #fff; padding: 1.5vw; border-radius: 14px; margin-bottom: 2vh; position: relative; width: clamp(12rem, 65vw, 16rem); height: clamp(12rem, 65vw, 16rem); display: flex; align-items: center; justify-content: center; }
.pay-qr img { display: none; width: 100%; height: 100%; object-fit: contain; }
.pay-qr img.active { display: block; }

.pay-address { font-family: 'VT323', monospace; font-size: clamp(0.9rem, 3.5vw, 1.1rem); color: #ccc; word-break: break-all; margin-bottom: 2vh; max-width: 90%; line-height: 1.3; text-align: center; }
.pay-copy { background: transparent; border: 2px solid #39ff14; color: #39ff14; font-family: 'Press Start 2P', monospace; font-size: clamp(0.5rem, 2vw, 0.65rem); padding: 1.5vh 6vw; border-radius: 24px; cursor: pointer; margin-bottom: 1vh; transition: all 0.3s ease; letter-spacing: 0.05em; }
.pay-copy:hover { background: #39ff14; color: #000; }
.pay-copy.copied { background: #00ff88; border-color: #00ff88; color: #000; }

/* Socials */
.socials { display: flex; gap: 5vw; align-items: center; justify-content: center; margin-bottom: 3vh; }
.socials a { display: flex; align-items: center; justify-content: center; width: clamp(3rem, 13vw, 4.5rem); height: clamp(3rem, 13vw, 4.5rem); border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); color: white; text-decoration: none; transition: all 0.3s ease; overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.socials a svg { width: 50%; height: 50%; fill: currentColor; transition: transform 0.3s ease; }
@media (hover: hover) {
    .socials a:hover { transform: translateY(-4px); }
    .socials a:hover svg { transform: scale(1.15); }
    .socials a.instagram:hover { border-color: #E1306C; box-shadow: 0 0 20px #E1306C; color: #E1306C; }
    .socials a.reddit:hover { border-color: #FF4500; box-shadow: 0 0 20px #FF4500; color: #FF4500; }
    .socials a.tumblr:hover { border-color: #529ecc; box-shadow: 0 0 20px #529ecc; color: #529ecc; }
}

.footer { font-family: 'VT323', monospace; font-size: clamp(0.8rem, 3vw, 1rem); color: #666; text-align: center; padding: 3vh 0 1.5vh 0; letter-spacing: 0.1em; margin-top: auto; }

@media only screen and (max-width: 430px) and (-webkit-min-device-pixel-ratio: 3) {
    .support-widget { padding: 6vw 4vw; }
}
</style>
</head>
<body>

        <div class="pay-qr-wrap" id="payQrWrap">

                <img src="tron.jpg" alt="TRON QR" class="qr-img" id="qr-tron">
                <img src="bnb.jpg" alt="BNB QR" class="qr-img" id="qr-bnb">

    <div class="footer">© 2026 5Ner</div>

    <script>
        var tokenColors = { 'tron': '#FA0B12', 'bnb': '#FCC703', 'eth': '#2D6EFA', 'sol': '#20E88B' };
        var currentAddress = '';
        var tokensNodeList = document.querySelectorAll('.pay-token');
        var idleInterval = null;
        var currentIdleIndex = 0;

        function startIdleAnimation() {
            if (idleInterval) clearInterval(idleInterval);
            
            function flashToken() {
                tokensNodeList.forEach(function(t) { t.classList.remove('lit', 'zap'); });
                if (document.querySelector('.pay-token.active')) return; 
                
                var token = tokensNodeList[currentIdleIndex];
                setTimeout(function(){ token.classList.add('zap'); }, 80);
                setTimeout(function(){ token.classList.add('lit'); }, 500);
                setTimeout(function(){ token.classList.remove('zap'); }, 1100);
                currentIdleIndex = (currentIdleIndex + 1) % tokensNodeList.length;
            }
            
            flashToken();
            idleInterval = setInterval(flashToken, 1600);
        }

        function stopIdleAnimation() {
            if (idleInterval) {
                clearInterval(idleInterval);
                idleInterval = null;
            }
        }

        window.pickToken = function(network, address, element) {
            stopIdleAnimation();
            
            document.getElementById('closeQrBtn').classList.add('active');

            tokensNodeList.forEach(function(t){ t.classList.remove('active','lit','zap'); });
            element.classList.add('active', 'lit');
            
            currentAddress = address;
            
            document.querySelectorAll('.qr-img').forEach(function(img){ img.classList.remove('active'); });
            document.getElementById('qr-' + network).classList.add('active');
            
            document.getElementById('payAddress').innerText = address;
            var color = tokenColors[network];
            
            var copyBtn = document.getElementById('payCopyBtn');
            copyBtn.style.borderColor = color;
            copyBtn.style.color = color;
            copyBtn.innerText = 'Copy address';
            copyBtn.classList.remove('copied');
            
            document.getElementById('payQrWrap').classList.add('active');
        };

        window.closeQr = function() {
            document.getElementById('payQrWrap').classList.remove('active');
            document.getElementById('closeQrBtn').classList.remove('active');
            
            tokensNodeList.forEach(function(t){ t.classList.remove('active','lit','zap'); });
            
            startIdleAnimation();
        };

        window.copyPayAddr = function(event) {
            event.stopPropagation();
            var btn = document.getElementById('payCopyBtn');
            navigator.clipboard.writeText(currentAddress).then(function(){
                btn.innerText = '✅ Copied!';
                btn.classList.add('copied');
                setTimeout(function(){ 
                    btn.innerText = 'Copy address'; 
                    btn.classList.remove('copied'); 
                }, 2000);
            }).catch(function(){ 
                alert('Address: ' + currentAddress); 
            });
        };

        window.addEventListener('DOMContentLoaded', function() {
            startIdleAnimation();
        });

        document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
        document.addEventListener('dragstart', function(e){ e.preventDefault(); });
    </script>
</body>
</html>
